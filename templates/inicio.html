{% extends "base.html" %}

{% block title %}Inicio - Consultora{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 100%;">
    <div style="text-align: center; background: #ffffff; padding: 60px 100px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
        <h1 style="color: #1e293b; font-size: 28px; margin-bottom: 10px;">Bienvenido al Sistema</h1>
        <p style="color: #64748b; font-size: 15px; margin-bottom: 40px;">Selecciona un módulo en el menú superior para comenzar a trabajar.</p>
        
        <!-- ESPACIO PARA EL LOGO -->
        <div style="width: 250px; height: 250px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin: 0 auto; background-color: #f8fafc; color: #94a3b8; font-weight: bold; font-size: 16px;">
            ESPACIO PARA EL LOGO
        </div>
    </div>
