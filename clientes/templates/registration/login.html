<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Consultora</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #e5e5e5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .login-box { background: #ffffff; width: 350px; padding: 30px; border: 1px solid #ccc; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .login-box h2 { text-align: center; color: #0056b3; margin-bottom: 20px; font-size: 18px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 13px; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        
        .btn-login { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn-login:hover { background: #004494; }
        
        .error-msg { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 3px; margin-bottom: 15px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Acceso al Sistema</h2>
        
        <!-- Si el usuario se equivoca, muestra este mensaje -->
        {% if form.errors %}
            <div class="error-msg">
                Usuario o contraseña incorrectos. Inténtalo de nuevo.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Usuario:</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </div>

</body>
</html>
